# NightJar + Redis.
#
#   cp .env.example .env     # set a provider key (OPENAI_API_KEY ...) and NIGHTJAR_API_KEYS=<a key you choose>
#   docker compose up --build -d
#   curl http://localhost:8000/health
#
# The image runs with NIGHTJAR_AUTH=required, so requests need `Authorization: Bearer <key>`
# (set NIGHTJAR_API_KEYS in .env, or create scoped keys: docker compose exec app python -m app.keys create ...).

services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Overrides REDIS_URL from .env: inside the container "localhost" is the container itself,
      # so the .env default would silently leave the cache without Redis.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  redis:
    image: redis:7-alpine
    # Not published to the host: only the app (on the compose network) can reach it. It holds cached
    # responses and prompt text. To inspect it: docker compose exec redis redis-cli
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
    driver: local
  redis-data:
    driver: local
