name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: "sk-test-ci-key"
      # Cache tests run against a real Redis (otherwise they spawn a local redis-server, or skip).
      REDIS_TEST_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Check requirements.txt is in sync with uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --frozen | grep -v '^#' > /tmp/exported.txt
          grep -v '^#' requirements.txt > /tmp/committed.txt
          diff /tmp/exported.txt /tmp/committed.txt
      - name: Lint
        run: uv run ruff check app/ tests/ benchmarks/
      - name: Test (mocked suite; live E2E tests are excluded by default, see pyproject.toml)
        run: uv run pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
      - name: Benchmark sanity check (dry-run, no server needed)
        run: uv run python benchmarks/run_benchmark.py --dry-run
        env:
          PYTHONPATH: .
